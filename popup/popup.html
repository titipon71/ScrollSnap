<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LongScreenshot</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <img src="../icons/icon48.png" alt="Logo" class="logo" />
        <div>
          <h1>LongScreenshot</h1>
          <p class="subtitle">แคปหน้าเว็บแบบยาวอัตโนมัติ</p>
        </div>
      </div>
      <span class="shortcut-badge" title="คีย์ลัดเริ่ม/หยุดแคป">Alt+Shift+S</span>
    </header>

    <!-- มุมมองปกติสำหรับกดเริ่มแคป -->
    <div id="idleView">
      <button id="startBtn" class="primary-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        <span>แคปทั้งหน้าเว็บ (Full Page)</span>
      </button>

      <div class="settings-card">
        <label class="setting-row" for="hideStickyToggle">
          <div class="setting-info">
            <span class="setting-title">ซ่อนแถบเมนูซ้ำ (Sticky / Fixed)</span>
            <span class="setting-desc">แสดงเฉพาะเฟรมแรก ไม่ให้บังเนื้อหาด้านล่าง</span>
          </div>
          <input type="checkbox" id="hideStickyToggle" checked />
        </label>

        <div class="divider"></div>

        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-title">เพดานความสูงสูงสุด</span>
            <span class="setting-desc">ป้องกันค้างในหน้าเว็บเลื่อนไม่สิ้นสุด</span>
          </div>
          <select id="maxHeightSelect" class="select-input">
            <option value="10000">10,000 px</option>
            <option value="20000" selected>20,000 px</option>
            <option value="30000">30,000 px</option>
          </select>
        </div>
      </div>

      <p class="hint-text">
        💡 ระหว่างแคป กดปุ่ม <kbd>Esc</kbd> บนหน้าเว็บเพื่อหยุดและรวมภาพได้ทันที
      </p>
    </div>

    <!-- มุมมองขณะกำลังแคป (ถ้าคลิกไอคอนขึ้นมาดูหรือต้องการกดหยุด) -->
    <div id="capturingView" class="hidden">
      <div class="progress-box">
        <div class="progress-header">
          <span class="status-dot"></span>
          <span id="progressText">กำลังเลื่อนและแคปหน้าจอ... (0%)</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progressBarFill" class="progress-bar-fill" style="width: 0%"></div>
        </div>
      </div>

      <button id="stopBtn" class="stop-btn">
        <span>หยุดแคปและรวมภาพทันที (Esc)</span>
      </button>
    </div>

    <div id="errorBox" class="error-box hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
